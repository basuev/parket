name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  dist:
    name: Distribution
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check
        run: make check

      - name: Verify distribution
        run: make verify-dist

      - name: Attest zip
        uses: actions/attest@v4
        with:
          subject-path: parket.zip
