name: AX Smoke

on:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-local:
    name: AX smoke local
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Smoke
        run: make smoke-local
